<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Bestiary of Cats — A Gothic Slide Deck</title>
  <meta name="description" content="A dark-academia slide deck of three cats, each with descriptive alt text and an ornate description." />

  <!-- Display & body serifs; falls back gracefully to system serifs if the CDN is blocked. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-deep: #14110f;
      --bg-near: #1c1714;
      --ink: #e8dfce;        /* aged ivory / parchment */
      --ink-dim: #b9ad96;
      --oxblood: #7c2d2d;
      --gold: #b08d57;
      --gold-soft: #c9a96a;
      --frame: #3a2f26;
      --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --body: "EB Garamond", Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      font-family: var(--body);
      color: var(--ink);
      /* Candlelit radial glow over a deep charcoal field — pure CSS, no images. */
      background:
        radial-gradient(ellipse at 50% 18%, rgba(176, 141, 87, 0.16), transparent 55%),
        radial-gradient(ellipse at 50% 120%, rgba(124, 45, 45, 0.18), transparent 60%),
        linear-gradient(160deg, var(--bg-near), var(--bg-deep));
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(1rem, 3vw, 2.5rem);
      line-height: 1.6;
    }

    /* Faint vignette to draw the eye inward. */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 22vw 4vw rgba(0, 0, 0, 0.65);
      z-index: 0;
    }

    header, main, footer { position: relative; z-index: 1; width: 100%; }

    header {
      text-align: center;
      max-width: 60rem;
      margin: 0 auto clamp(1.25rem, 3vw, 2.25rem);
    }

    .eyebrow {
      font-family: var(--body);
      font-style: italic;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: clamp(0.7rem, 1.6vw, 0.85rem);
      color: var(--gold-soft);
      margin: 0 0 0.5rem;
    }

    h1 {
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(2.3rem, 7vw, 4.25rem);
      line-height: 1.05;
      margin: 0;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.5);
    }

    .epigraph {
      font-style: italic;
      color: var(--ink-dim);
      max-width: 38rem;
      margin: 0.85rem auto 0;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
    }

    /* Ornamental divider */
    .rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin: 1.1rem auto 0;
      color: var(--gold);
    }
    .rule::before, .rule::after {
      content: "";
      height: 1px;
      width: clamp(2.5rem, 18vw, 9rem);
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .rule span { font-size: 1rem; letter-spacing: 0.3em; }

    main {
      max-width: 64rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .carousel { width: 100%; }

    .slide[hidden] { display: none; }

    .slide {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
      gap: clamp(1rem, 3vw, 2.25rem);
      align-items: center;
      margin: 0;
      animation: fade-in 0.5s ease both;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    /* Decorative double-rule plate around each image, with corner flourishes. */
    .plate {
      position: relative;
      padding: clamp(0.5rem, 1.6vw, 0.9rem);
      background: linear-gradient(180deg, #100d0b, #1a1511);
      border: 1px solid var(--frame);
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.6),
        inset 0 0 0 4px rgba(176, 141, 87, 0.18),
        inset 0 0 28px rgba(0, 0, 0, 0.7);
    }
    .plate::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(176, 141, 87, 0.45);
      pointer-events: none;
    }
    /* Gilded corner ticks */
    .plate::after {
      content: "";
      position: absolute;
      inset: 10px;
      pointer-events: none;
      background:
        linear-gradient(var(--gold), var(--gold)) left top,
        linear-gradient(var(--gold), var(--gold)) left top,
        linear-gradient(var(--gold), var(--gold)) right top,
        linear-gradient(var(--gold), var(--gold)) right top,
        linear-gradient(var(--gold), var(--gold)) left bottom,
        linear-gradient(var(--gold), var(--gold)) left bottom,
        linear-gradient(var(--gold), var(--gold)) right bottom,
        linear-gradient(var(--gold), var(--gold)) right bottom;
      background-repeat: no-repeat;
      background-size: 14px 1px, 1px 14px;
    }

    .plate img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      background: #000;
    }

    figcaption {
      font-size: clamp(1rem, 2.1vw, 1.15rem);
      color: var(--ink);
    }

    .slide-kicker {
      font-family: var(--body);
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.78rem;
      color: var(--gold-soft);
      margin: 0 0 0.35rem;
    }

    .slide-title {
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      line-height: 1.1;
      margin: 0 0 0.75rem;
    }

    .desc { margin: 0; color: var(--ink-dim); }

    /* Drop cap on the description's first letter. */
    .desc::first-letter {
      font-family: var(--display);
      font-size: 3.2em;
      line-height: 0.8;
      float: left;
      padding: 0.05em 0.1em 0 0;
      color: var(--gold);
    }

    /* ---- Controls ---- */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.75rem, 3vw, 1.75rem);
      margin-top: clamp(1.5rem, 4vw, 2.5rem);
      flex-wrap: wrap;
    }

    .nav-btn {
      font-family: var(--display);
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      color: var(--ink);
      background: linear-gradient(180deg, #221b16, #15110e);
      border: 1px solid var(--gold);
      border-radius: 2px;
      padding: 0.7rem 1.25rem;
      min-height: 44px;
      min-width: 44px;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease, transform 0.15s ease;
    }
    .nav-btn:hover { background: var(--oxblood); color: #fff; }
    .nav-btn:active { transform: translateY(1px); }
    .nav-btn:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }

    .dots { display: flex; gap: 0.7rem; }

    .dot {
      width: 14px;
      height: 14px;
      min-width: 44px;
      min-height: 44px;
      display: grid;
      place-items: center;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    .dot::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      background: transparent;
      transition: background 0.25s ease, transform 0.2s ease;
    }
    .dot[aria-current="true"]::before { background: var(--gold); transform: scale(1.15); }
    .dot:hover::before { background: var(--oxblood); border-color: var(--oxblood); }
    .dot:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; border-radius: 50%; }

    .counter {
      margin-top: 1rem;
      text-align: center;
      font-style: italic;
      letter-spacing: 0.12em;
      color: var(--ink-dim);
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      margin-top: clamp(2rem, 5vw, 3.5rem);
      color: var(--ink-dim);
      font-style: italic;
      font-size: 0.85rem;
      max-width: 40rem;
      margin-inline: auto;
    }

    /* ---- Responsive: stack on narrow screens ---- */
    @media (max-width: 760px) {
      .slide {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .plate img { max-height: 56vh; }
      .desc::first-letter { float: none; font-size: 1em; padding: 0; color: inherit; }
      .desc { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide { animation: none; }
      .nav-btn, .dot::before { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">A Curated Exhibition</p>
    <h1>A Bestiary of Cats</h1>
    <p class="epigraph">Three small familiars, studied by candlelight &mdash; their idle hours catalogued, annotated, and framed for posterity.</p>
    <div class="rule" aria-hidden="true"><span>&#10070;</span></div>
  </header>

  <main>
    <section
      class="carousel"
      role="region"
      aria-roledescription="carousel"
      aria-label="Cat slide deck"
    >
      <!-- Slide 1 -->
      <figure class="slide" id="slide-1" aria-roledescription="slide" aria-label="Slide 1 of 3">
        <div class="plate">
          <img
            src="IMG_5512.jpeg"
            alt="An orange tabby cat with green eyes looks up directly at the camera while sitting on grey carpet."
            width="600" height="450"
            loading="eager" decoding="async"
          />
        </div>
        <figcaption>
          <p class="slide-kicker">Plate the First &middot; The Ginger Scholar</p>
          <h2 class="slide-title">The Upward Gaze</h2>
          <p class="desc">A scholar of the floor, this amber-coated familiar peers upward with two green lanterns for eyes, as though you had interrupted some grave deliberation upon the carpet&rsquo;s ancient weave. One ear tips backward in suspicion; the verdict, it seems, is still pending.</p>
        </figcaption>
      </figure>

      <!-- Slide 2 -->
      <figure class="slide" id="slide-2" aria-roledescription="slide" aria-label="Slide 2 of 3" hidden>
        <div class="plate">
          <img
            src="IMG_5604.jpeg"
            alt="A cream-colored tabby lies belly-up on a red patterned cloth while a dark tortoiseshell cat sleeps curled behind it on a bed."
            width="600" height="450"
            loading="lazy" decoding="async"
          />
        </div>
        <figcaption>
          <p class="slide-kicker">Plate the Second &middot; The Conspirators</p>
          <h2 class="slide-title">A Pact of Repose</h2>
          <p class="desc">Two conspirators at rest: one orange-furred dreamer abandoned to the velvet abyss, paws surrendered to the heavens upon a crimson tapestry, while behind it a tortoiseshell shadow keeps its coiled, secret vigil. Whatever scheme they have hatched, it will be finished only after the nap.</p>
        </figcaption>
      </figure>

      <!-- Slide 3 -->
      <figure class="slide" id="slide-3" aria-roledescription="slide" aria-label="Slide 3 of 3" hidden>
        <div class="plate">
          <img
            src="IMG_5825.jpeg"
            alt="Close-up of a brown mackerel tabby cat with white markings resting its head on a fuzzy pink blanket."
            width="600" height="450"
            loading="lazy" decoding="async"
          />
        </div>
        <figcaption>
          <p class="slide-kicker">Plate the Third &middot; The Contemplative</p>
          <h2 class="slide-title">Wisdom in Repose</h2>
          <p class="desc">Pressed cheek-first into a cloud of rose, this striped contemplative regards the middle distance with the weary wisdom of a creature who has read every book in the house and napped through most of them. The whiskers are immaculate; the schedule, entirely its own.</p>
        </figcaption>
      </figure>
    </section>

    <div class="controls">
      <button class="nav-btn" id="prev" type="button" aria-label="Previous slide">&#8592; Prev</button>
      <div class="dots" role="tablist" aria-label="Choose a slide">
        <button class="dot" type="button" data-index="0" role="tab" aria-label="Go to slide 1" aria-current="true"></button>
        <button class="dot" type="button" data-index="1" role="tab" aria-label="Go to slide 2"></button>
        <button class="dot" type="button" data-index="2" role="tab" aria-label="Go to slide 3"></button>
      </div>
      <button class="nav-btn" id="next" type="button" aria-label="Next slide">Next &#8594;</button>
    </div>

    <p class="counter" id="counter" aria-live="polite">Plate 1 of 3</p>
  </main>

  <footer>
    <p>Use the arrows, the dots, or your keyboard (&larr; &rarr;) to turn the leaves of this small bestiary. Swipe on touch devices.</p>
  </footer>

  <script>
    (function () {
      var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
      var dots = Array.prototype.slice.call(document.querySelectorAll(".dot"));
      var prevBtn = document.getElementById("prev");
      var nextBtn = document.getElementById("next");
      var counter = document.getElementById("counter");
      var carousel = document.querySelector(".carousel");
      var total = slides.length;
      var current = 0;

      function show(index) {
        // Wrap around at the ends for smoother navigation.
        current = (index + total) % total;
        slides.forEach(function (slide, i) {
          var active = i === current;
          slide.hidden = !active;
          slide.setAttribute("aria-hidden", active ? "false" : "true");
        });
        dots.forEach(function (dot, i) {
          if (i === current) {
            dot.setAttribute("aria-current", "true");
          } else {
            dot.removeAttribute("aria-current");
          }
        });
        counter.textContent = "Plate " + (current + 1) + " of " + total;
      }

      prevBtn.addEventListener("click", function () { show(current - 1); });
      nextBtn.addEventListener("click", function () { show(current + 1); });

      dots.forEach(function (dot) {
        dot.addEventListener("click", function () {
          show(parseInt(dot.getAttribute("data-index"), 10));
        });
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowLeft") { show(current - 1); }
        else if (e.key === "ArrowRight") { show(current + 1); }
        else if (e.key === "Home") { show(0); }
        else if (e.key === "End") { show(total - 1); }
      });

      // Basic touch swipe on the carousel region.
      var startX = null;
      carousel.addEventListener("touchstart", function (e) {
        startX = e.changedTouches[0].clientX;
      }, { passive: true });
      carousel.addEventListener("touchend", function (e) {
        if (startX === null) { return; }
        var delta = e.changedTouches[0].clientX - startX;
        if (Math.abs(delta) > 40) {
          show(delta < 0 ? current + 1 : current - 1);
        }
        startX = null;
      }, { passive: true });

      show(0);
    })();
  </script>
</body>
</html>
